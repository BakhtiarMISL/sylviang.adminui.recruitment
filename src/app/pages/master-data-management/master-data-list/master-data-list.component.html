<section class="page-container" *ngIf="config">
  <div class="flex justify-between items-center gap-3 mb-4">
    <h3 class="table-title">{{ config.title }}</h3>
    <button pButton [routerLink]="['/master-data', 'manage-' + config.routeKey]">
      <i class="fa fa-plus"></i>
      <span>Add {{ config.singularLabel }}</span>
    </button>
  </div>

  <small class="mb-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

  <div *ngIf="loading" class="space-y-3">
    <p-skeleton height="3rem" *ngFor="let i of skeletonItems"></p-skeleton>
  </div>

  <div *ngIf="!loading && items.length === 0" class="table-container">
    <div class="not-found">
      <i class="fa fa-magnifying-glass-minus"></i>
      <p>No {{ config.title.toLowerCase() }} configured yet.</p>
    </div>
  </div>

  <p-table
    *ngIf="!loading && items.length > 0"
    #dt
    [value]="items"
    styleClass="p-datatable-sm"
    [paginator]="true"
    [rows]="rows"
    [first]="first"
    (onPage)="onPage($event)"
    [rowsPerPageOptions]="[10, 25, 50]"
    [globalFilterFields]="globalFilterFields"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
  >
    <ng-template pTemplate="caption">
      <div class="flex justify-end">
        <input pInputText type="text" [(ngModel)]="searchTerm" (input)="onSearch()" placeholder="Search" class="w-64" />
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th *ngFor="let field of config.fields">{{ field.label }}</th>
        <th style="width: 12rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td *ngFor="let field of config.fields">{{ item[field.key] }}</td>
        <td>
          <div class="flex gap-2">
            <button pButton size="small" severity="secondary" [routerLink]="['/master-data', 'manage-' + config.routeKey, idOf(item)]">
              <i class="fa fa-edit"></i>
              <span>Edit</span>
            </button>
            <button pButton size="small" severity="danger" (click)="deleteItem(item, $event)">
              <i class="fa fa-trash"></i>
              <span>Delete</span>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="config.fields.length + 1" class="not-found">
          <div>
            <i class="fa fa-magnifying-glass-minus"></i>
            <p>No matching {{ config.title.toLowerCase() }}.</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-confirmDialog></p-confirmDialog>
</section>
