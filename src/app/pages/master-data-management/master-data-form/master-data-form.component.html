<section class="page-container" *ngIf="config && form">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="table-container mb-4 p-4">
      <h3 class="table-title mb-3">{{ isEditMode ? 'Edit' : 'Add' }} {{ config.singularLabel }}</h3>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <ng-container *ngFor="let field of config.fields">
          <div>
            <p-floatlabel variant="in">
              <input
                *ngIf="field.type === 'text'"
                pInputText
                [id]="field.key"
                class="w-full"
                [formControlName]="field.key"
              />
              <p-inputnumber *ngIf="field.type === 'number'" [inputId]="field.key" class="w-full" [formControlName]="field.key" [useGrouping]="false">
              </p-inputnumber>
              <label [for]="field.key" [class.required-label]="field.required">{{ field.label }}</label>
            </p-floatlabel>
            <small class="text-red-500" *ngIf="hasError(field.key) && form.get(field.key)?.errors?.['required']">{{ field.label }} is required.</small>
            <small class="text-red-500" *ngIf="hasError(field.key) && form.get(field.key)?.errors?.['maxlength']">
              {{ field.label }} must not exceed {{ field.maxLength }} characters.
            </small>
            <small class="text-red-500" *ngIf="hasError(field.key) && form.get(field.key)?.errors?.['pattern']">
              {{ patternError(field.key) || (field.label + ' is invalid.') }}
            </small>
            <small class="text-neutral" *ngIf="field.placeholder && !hasError(field.key)">{{ field.placeholder }}</small>
          </div>
        </ng-container>
      </div>

      <small class="mt-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

      <div class="mt-4 flex gap-2">
        <button pButton type="submit">
          <i class="fa fa-save"></i>
          <span>{{ isEditMode ? 'Save Changes' : 'Create ' + config.singularLabel }}</span>
        </button>
        <button pButton type="button" severity="secondary" [routerLink]="['/master-data', config.routeKey + '-list']">
          <span>Cancel</span>
        </button>
      </div>
    </div>
  </form>
</section>
