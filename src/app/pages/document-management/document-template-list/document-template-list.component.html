<section class="page-container">
  <div class="flex justify-between items-center gap-3 mb-4">
    <h3 class="table-title">Document Templates</h3>
    <button pButton [routerLink]="['/document-management', 'manage-document-template']">
      <i class="fa fa-plus"></i>
      <span>Add Template</span>
    </button>
  </div>

  <small class="mb-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

  <div *ngIf="loading" class="space-y-3">
    <p-skeleton height="3rem" *ngFor="let i of skeletonItems"></p-skeleton>
  </div>

  <div *ngIf="!loading && items.length === 0" class="table-container">
    <div class="not-found">
      <i class="fa fa-magnifying-glass-minus"></i>
      <p>No document templates configured yet.</p>
    </div>
  </div>

  <p-table
    *ngIf="!loading && items.length > 0"
    #dt
    [value]="items"
    styleClass="p-datatable-sm"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [globalFilterFields]="['code', 'name', 'documentType']"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
  >
    <ng-template pTemplate="caption">
      <div class="flex justify-end">
        <input pInputText type="text" [(ngModel)]="searchTerm" (input)="dt.filterGlobal(searchTerm, 'contains')" placeholder="Search" class="w-64" />
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th>Code</th>
        <th>Name</th>
        <th>Type</th>
        <th>Version</th>
        <th>Status</th>
        <th style="width: 12rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="not-found">
          <div>
            <i class="fa fa-magnifying-glass-minus"></i>
            <p>No matching document templates.</p>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.code }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.documentType }}</td>
        <td>v{{ item.currentVersionNumber }}</td>
        <td>
          <span [class]="item.isActive ? 'text-green-600' : 'text-neutral'">{{ item.isActive ? 'Active' : 'Inactive' }}</span>
        </td>
        <td>
          <div class="flex gap-2">
            <button pButton size="small" severity="secondary" [routerLink]="['/document-management', 'manage-document-template', item.documentTemplateId]">
              <i class="fa fa-edit"></i>
              <span>Edit</span>
            </button>
            <button pButton size="small" severity="danger" (click)="deleteItem(item, $event)">
              <i class="fa fa-trash"></i>
              <span>Delete</span>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-confirmDialog></p-confirmDialog>
</section>
