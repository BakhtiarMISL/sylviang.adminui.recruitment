<section class="page-container">
  <div class="flex justify-between items-center gap-3 mb-4">
    <h3 class="table-title">Appointment Letters</h3>
  </div>

  <small class="mb-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

  <div *ngIf="loading" class="space-y-3">
    <p-skeleton height="3rem" *ngFor="let i of skeletonItems"></p-skeleton>
  </div>

  <div *ngIf="!loading && items.length === 0" class="table-container">
    <div class="not-found">
      <i class="fa fa-magnifying-glass-minus"></i>
      <p>No appointment letters generated yet.</p>
    </div>
  </div>

  <p-table *ngIf="!loading && items.length > 0" [value]="items" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Candidate</th>
        <th>Template</th>
        <th>Generated At</th>
        <th style="width: 8rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.candidateName }}</td>
        <td>{{ item.documentTemplateName }}</td>
        <td>{{ item.generatedAt | date: 'dd-MMM-yyyy h:mm a' }}</td>
        <td>
          <a pButton size="small" severity="secondary" [href]="getPdfUrl(item)" target="_blank" rel="noopener noreferrer">
            <i class="fa fa-download"></i>
            <span>PDF</span>
          </a>
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>
