<section class="page-container" *ngIf="form">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="table-container mb-4 p-4">
      <h3 class="table-title mb-3">{{ isEditMode ? 'Edit Company' : 'Create Company' }}</h3>

      <div class="mb-6">
        <label class="mb-2 block text-sm font-medium text-gray-700">Company Logo</label>
        <img *ngIf="logoUrl" [src]="logoUrl" class="media-preview" alt="Company logo" />

        <label for="companyLogoFile" class="upload-dropzone" [class.disabled]="uploadingLogo">
          <i class="fas" [class.fa-spinner]="uploadingLogo" [class.fa-spin]="uploadingLogo" [class.fa-cloud-upload-alt]="!uploadingLogo"></i>
          <span class="upload-dropzone-text">
            <strong>{{ uploadingLogo ? 'Uploading...' : pendingLogoFile ? 'Change logo' : 'Click to upload logo' }}</strong>
            <small>{{ !isEditMode && pendingLogoFile ? 'Will be uploaded on Create' : 'JPG, PNG or SVG' }}</small>
          </span>
        </label>
        <input id="companyLogoFile" type="file" (change)="onLogoSelected($event)" accept=".jpg,.jpeg,.png,.svg" [disabled]="uploadingLogo" class="sr-only file-picker-input" />

        <small class="mt-1 block text-red-500" *ngIf="logoError">{{ logoError }}</small>
      </div>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div class="sm:col-span-2">
          <p-floatlabel variant="in">
            <input pInputText id="name" class="w-full" formControlName="name" [disabled]="submitting" />
            <label for="name">Company Name</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('name') && form.get('name')?.errors?.['required']">Company name is required.</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="email" class="w-full" formControlName="email" [disabled]="submitting" />
            <label for="email">Email</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('email') && form.get('email')?.errors?.['email']">A valid email is required.</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="phone" class="w-full" formControlName="phone" [disabled]="submitting" />
            <label for="phone">Phone</label>
          </p-floatlabel>
        </div>

        <div class="sm:col-span-2">
          <p-floatlabel variant="in">
            <input pInputText id="address" class="w-full" formControlName="address" [disabled]="submitting" />
            <label for="address">Address</label>
          </p-floatlabel>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="website" class="w-full" formControlName="website" [disabled]="submitting" />
            <label for="website">Website</label>
          </p-floatlabel>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="industry" class="w-full" formControlName="industry" [disabled]="submitting" />
            <label for="industry">Industry</label>
          </p-floatlabel>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="tradeLicenseNumber" class="w-full" formControlName="tradeLicenseNumber" [disabled]="submitting" />
            <label for="tradeLicenseNumber">Trade License Number</label>
          </p-floatlabel>
          <small class="block text-gray-500">e.g. TRAD/DNCC/123456/2024</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="binNumber" class="w-full" formControlName="binNumber" [disabled]="submitting" />
            <label for="binNumber">BIN (Business Identification Number)</label>
          </p-floatlabel>
          <small class="block text-gray-500">e.g. 000123456-0102</small>
        </div>
      </div>

      <small class="mt-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

      <div class="mt-4 flex gap-2">
        <button pButton type="submit" [disabled]="submitting">
          <i [class]="submitting ? 'fa-solid fa-spinner fa-spin' : 'fa fa-save'" aria-hidden="true"></i>
          <span>{{ submitting ? 'Saving…' : (isEditMode ? 'Save Changes' : 'Create Company') }}</span>
        </button>
        <button pButton type="button" severity="secondary" [routerLink]="['/company-management/company-list']" [disabled]="submitting">
          <span>Cancel</span>
        </button>
      </div>
    </div>
  </form>
</section>
