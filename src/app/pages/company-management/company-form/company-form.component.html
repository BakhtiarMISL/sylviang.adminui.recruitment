<section class="page-container" *ngIf="form">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="table-container mb-4 p-4">
      <h3 class="table-title mb-3">{{ isEditMode ? 'Edit Company' : 'Create Company' }}</h3>

      <div class="mb-4 flex items-center gap-3" *ngIf="isEditMode">
        <img *ngIf="logoUrl" [src]="logoUrl" alt="" class="h-16 w-16 rounded object-cover border" />
        <div class="flex h-16 w-16 items-center justify-center rounded border bg-gray-50 text-gray-400" *ngIf="!logoUrl">
          <i class="fa fa-building fa-lg"></i>
        </div>
        <div>
          <label class="cursor-pointer text-sm font-medium text-primary">
            <input type="file" accept="image/*" class="hidden" (change)="onLogoSelected($event)" [disabled]="uploadingLogo" />
            {{ uploadingLogo ? 'Uploading…' : 'Upload logo' }}
          </label>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div class="sm:col-span-2">
          <p-floatlabel variant="in">
            <input pInputText id="name" class="w-full" formControlName="name" [disabled]="submitting" />
            <label for="name">Company Name</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('name') && form.get('name')?.errors?.['required']">Company name is required.</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="email" class="w-full" formControlName="email" [disabled]="submitting" />
            <label for="email">Email</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('email') && form.get('email')?.errors?.['email']">A valid email is required.</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="phone" class="w-full" formControlName="phone" [disabled]="submitting" />
            <label for="phone">Phone</label>
          </p-floatlabel>
        </div>

        <div class="sm:col-span-2">
          <p-floatlabel variant="in">
            <input pInputText id="address" class="w-full" formControlName="address" [disabled]="submitting" />
            <label for="address">Address</label>
          </p-floatlabel>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="website" class="w-full" formControlName="website" [disabled]="submitting" />
            <label for="website">Website</label>
          </p-floatlabel>
        </div>

        <div>
          <p-floatlabel variant="in">
            <input pInputText id="industry" class="w-full" formControlName="industry" [disabled]="submitting" />
            <label for="industry">Industry</label>
          </p-floatlabel>
        </div>
      </div>

      <small class="mt-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

      <div class="mt-4 flex gap-2">
        <button pButton type="submit" [disabled]="submitting">
          <i [class]="submitting ? 'fa-solid fa-spinner fa-spin' : 'fa fa-save'" aria-hidden="true"></i>
          <span>{{ submitting ? 'Saving…' : (isEditMode ? 'Save Changes' : 'Create Company') }}</span>
        </button>
        <button pButton type="button" severity="secondary" [routerLink]="['/company-management/company-list']" [disabled]="submitting">
          <span>Cancel</span>
        </button>
      </div>
    </div>
  </form>
</section>
