<section class="page-container">
  <div class="table-container p-4">
    <h3 class="table-title mb-3">Branding Settings</h3>
    <p class="mb-4 text-sm text-gray-500">Controls how every generated document (admit cards, offer letters, CVs, etc.) is branded.</p>

    <div *ngIf="loading" class="space-y-3">
      <p-skeleton height="2.5rem" width="16rem"></p-skeleton>
    </div>

    <ng-container *ngIf="!loading">
      <div class="mb-6">
        <label class="mb-2 block text-sm font-medium text-gray-700">Company Logo</label>
        <div class="flex items-center gap-4">
          <img *ngIf="logoUrl" [src]="logoUrl" alt="Company logo" class="h-16 w-16 rounded border border-gray-300 object-contain" />
          <div *ngIf="!logoUrl" class="flex h-16 w-16 items-center justify-center rounded border border-dashed border-gray-300 text-xs text-gray-400">No logo</div>

          <label class="cursor-pointer rounded border border-gray-300 px-3 py-2 text-sm hover:bg-gray-50">
            <input type="file" class="hidden" accept=".jpg,.jpeg,.png,.svg" (change)="onLogoSelected($event)" [disabled]="uploadingLogo" />
            {{ uploadingLogo ? 'Uploading...' : 'Upload Logo' }}
          </label>
        </div>
        <small class="mt-1 block text-red-500" *ngIf="logoError">{{ logoError }}</small>
      </div>

      <form [formGroup]="settingsForm" (ngSubmit)="onSubmit()">
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
          <p-floatlabel variant="in">
            <input pInputText id="companyName" class="w-full" formControlName="companyName" />
            <label for="companyName">Company Name</label>
          </p-floatlabel>

          <p-floatlabel variant="in">
            <input pInputText id="addressLine" class="w-full" formControlName="addressLine" />
            <label for="addressLine">Address</label>
          </p-floatlabel>

          <p-floatlabel variant="in">
            <input pInputText id="phone" class="w-full" formControlName="phone" />
            <label for="phone">Phone</label>
          </p-floatlabel>

          <p-floatlabel variant="in">
            <input pInputText id="email" class="w-full" formControlName="email" />
            <label for="email">Email</label>
          </p-floatlabel>

          <p-floatlabel variant="in">
            <input pInputText id="website" class="w-full" formControlName="website" />
            <label for="website">Website</label>
          </p-floatlabel>

          <div>
            <p-floatlabel variant="in">
              <p-select inputId="fontFamily" [options]="fontFamilyOptions" [appendTo]="'body'" optionLabel="label" optionValue="value" formControlName="fontFamily" class="w-full"></p-select>
              <label for="fontFamily">Font Family</label>
            </p-floatlabel>
          </div>

          <div>
            <p-floatlabel variant="in">
              <p-select inputId="borderStyle" [options]="borderStyleOptions" [appendTo]="'body'" optionLabel="label" optionValue="value" formControlName="borderStyle" class="w-full"></p-select>
              <label for="borderStyle">Border Style</label>
            </p-floatlabel>
          </div>
        </div>

        <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
          <div>
            <label class="mb-1 block text-sm font-medium text-gray-700" for="primaryColor">Primary Color</label>
            <input type="color" id="primaryColor" formControlName="primaryColor" class="h-9 w-14 cursor-pointer rounded border border-gray-300" />
          </div>
          <div>
            <label class="mb-1 block text-sm font-medium text-gray-700" for="secondaryColor">Secondary Color</label>
            <input type="color" id="secondaryColor" formControlName="secondaryColor" class="h-9 w-14 cursor-pointer rounded border border-gray-300" />
          </div>
          <div>
            <label class="mb-1 block text-sm font-medium text-gray-700" for="accentColor">Accent Color</label>
            <input type="color" id="accentColor" formControlName="accentColor" class="h-9 w-14 cursor-pointer rounded border border-gray-300" />
          </div>
        </div>

        <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div class="flex items-center gap-2">
            <p-checkbox inputId="showPageNumbers" formControlName="showPageNumbers" [binary]="true"></p-checkbox>
            <label for="showPageNumbers">Show page numbers in footer</label>
          </div>

          <div class="flex items-center gap-2">
            <p-checkbox inputId="backgroundWatermarkEnabled" formControlName="backgroundWatermarkEnabled" [binary]="true"></p-checkbox>
            <label for="backgroundWatermarkEnabled">Enable background watermark</label>
          </div>

          <div *ngIf="f['backgroundWatermarkEnabled'].value">
            <p-floatlabel variant="in">
              <p-inputnumber inputId="watermarkOpacity" class="w-full" formControlName="watermarkOpacity" [min]="0" [max]="100" suffix="%" [useGrouping]="false"></p-inputnumber>
              <label for="watermarkOpacity">Watermark Opacity</label>
            </p-floatlabel>
          </div>
        </div>

        <small class="mt-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>
        <small class="mt-3 block text-green-600" *ngIf="successMessage">{{ successMessage }}</small>

        <div class="mt-4 flex gap-2">
          <button pButton type="submit" [disabled]="saving">
            <i class="fa fa-save"></i>
            <span>{{ saving ? 'Saving...' : 'Save Changes' }}</span>
          </button>
          <button pButton type="button" severity="secondary" [disabled]="previewing" (click)="onPreview()">
            <i class="fa fa-file-pdf"></i>
            <span>{{ previewing ? 'Generating...' : 'Preview PDF' }}</span>
          </button>
        </div>
      </form>
    </ng-container>
  </div>
</section>
