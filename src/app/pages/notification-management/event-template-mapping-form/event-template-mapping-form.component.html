<section class="page-container" *ngIf="form">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="table-container mb-4 p-4">
      <h3 class="table-title mb-3">{{ isEditMode ? 'Edit' : 'Add' }} Event → Template Mapping</h3>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div>
          <p-floatlabel variant="in">
            <p-select
              inputId="recruitmentEvent"
              class="w-full"
              [options]="eventOptions"
              formControlName="recruitmentEvent"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
            ></p-select>
            <label for="recruitmentEvent">Recruitment Event</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('recruitmentEvent')">Event is required.</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <p-select
              inputId="channel"
              class="w-full"
              [options]="channelOptions"
              formControlName="channel"
              optionLabel="label"
              optionValue="value"
              optionDisabled="disabled"
              [appendTo]="'body'"
            ></p-select>
            <label for="channel">Channel</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('channel')">Channel is required.</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <p-select
              inputId="recipientType"
              class="w-full"
              [options]="recipientOptions"
              formControlName="recipientType"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
            ></p-select>
            <label for="recipientType">Recipient</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('recipientType')">Recipient is required.</small>
          <small class="text-neutral" *ngIf="isEditMode">Event, Channel and Recipient cannot be changed after creation.</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <p-select
              inputId="notificationTemplateId"
              class="w-full"
              [options]="templateOptionsForChannel"
              formControlName="notificationTemplateId"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
            ></p-select>
            <label for="notificationTemplateId">Template</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('notificationTemplateId')">Template is required.</small>
        </div>
      </div>

      <small class="mt-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

      <div class="mt-4 flex gap-2">
        <button pButton type="submit">
          <i class="fa fa-save"></i>
          <span>{{ isEditMode ? 'Save Changes' : 'Create Mapping' }}</span>
        </button>
        <button pButton type="button" severity="secondary" [routerLink]="['/notification-management/event-template-mapping-list']">
          <span>Cancel</span>
        </button>
      </div>
    </div>
  </form>
</section>
