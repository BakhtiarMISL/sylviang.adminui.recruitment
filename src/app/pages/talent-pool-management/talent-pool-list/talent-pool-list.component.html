<section class="page-container">
  <div class="flex justify-between items-center gap-3 mb-4">
    <h3 class="table-title">Talent Pools</h3>
    <button pButton (click)="openCreateDialog()">
      <i class="fa fa-plus"></i>
      <span>Create Pool</span>
    </button>
  </div>

  <div *ngIf="loading" class="space-y-3">
    <p-skeleton height="4rem" *ngFor="let i of skeletonItems"></p-skeleton>
  </div>

  <div *ngIf="!loading && pools.length === 0" class="table-container">
    <div class="not-found">
      <i class="fa fa-users"></i>
      <p>No talent pools yet. Create one to start saving promising candidates for future vacancies.</p>
    </div>
  </div>

  <div *ngIf="!loading" class="grid grid-cols-1 gap-4">
    <div *ngFor="let pool of pools" class="rounded-lg bg-white p-4 shadow-sm dark:bg-dark">
      <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-center">
        <div>
          <h4 class="text-lg font-medium text-gray-900 dark:text-white">{{ pool.name }}</h4>
          <p class="mt-1 text-sm text-gray-500">{{ pool.candidateCount }} {{ pool.candidateCount === 1 ? 'candidate' : 'candidates' }}</p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button pButton severity="secondary" [routerLink]="['/talent-pools/talent-pool-detail', pool.talentPoolId]">
            <i class="fa fa-eye"></i>
            <span>View</span>
          </button>
          <button pButton severity="danger" (click)="deletePool(pool, $event)">
            <i class="fa fa-trash"></i>
            <span>Delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

<p-dialog header="Create Talent Pool" [(visible)]="showCreateDialog" [modal]="true" [style]="{ width: '28rem' }">
  <div class="form-container">
    <p-floatlabel variant="in" class="sm:col-span-2">
      <input type="text" pInputText id="poolName" class="w-full" [(ngModel)]="newPoolName" name="poolName" (keyup.enter)="createPool()" />
      <label for="poolName">Pool name (e.g. "Senior Engineers – 2026")</label>
    </p-floatlabel>

    <div *ngIf="createError" class="invalid sm:col-span-2">{{ createError }}</div>
  </div>

  <ng-template pTemplate="footer">
    <button pButton severity="secondary" (click)="showCreateDialog = false">Cancel</button>
    <button pButton [disabled]="creating || !newPoolName.trim()" (click)="createPool()">
      {{ creating ? 'Creating...' : 'Create' }}
    </button>
  </ng-template>
</p-dialog>
