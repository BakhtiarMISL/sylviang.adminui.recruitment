<section class="page-container">
  <form [formGroup]="questionForm" (ngSubmit)="onSubmit()">
    <div class="table-container mb-4 p-4">
      <h3 class="table-title mb-3">{{ isEditMode ? 'Edit Question' : 'Add Question' }}</h3>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <p-floatlabel variant="in">
          <p-select
            inputId="questionGroupId"
            class="w-full"
            [options]="groupLookup"
            formControlName="questionGroupId"
            optionLabel="name"
            optionValue="questionGroupId"
            [appendTo]="'body'"
          ></p-select>
          <label for="questionGroupId" class="required-label">Question Group</label>
        </p-floatlabel>
        <small class="text-red-500" *ngIf="hasError('questionGroupId')">Question group is required.</small>

        <p-floatlabel variant="in">
          <p-select
            inputId="questionType"
            class="w-full"
            [options]="questionTypeOptions"
            formControlName="questionType"
            optionLabel="label"
            optionValue="value"
            [appendTo]="'body'"
            (onChange)="onQuestionTypeChange()"
          ></p-select>
          <label for="questionType" class="required-label">Question Type</label>
        </p-floatlabel>

        <p-floatlabel variant="in" class="sm:col-span-2">
          <textarea pTextarea id="questionText" class="w-full" formControlName="questionText" rows="2"></textarea>
          <label for="questionText" class="required-label">Question Text</label>
        </p-floatlabel>
        <small class="text-red-500 sm:col-span-2" *ngIf="hasError('questionText')">Question text is required.</small>

        <p-floatlabel variant="in">
          <p-select
            inputId="difficultyLevel"
            class="w-full"
            [options]="difficultyLevelOptions"
            formControlName="difficultyLevel"
            optionLabel="label"
            optionValue="value"
            [appendTo]="'body'"
          ></p-select>
          <label for="difficultyLevel" class="required-label">Difficulty Level</label>
        </p-floatlabel>

        <p-floatlabel variant="in">
          <p-inputNumber inputId="marks" class="w-full" formControlName="marks" [minFractionDigits]="0" [maxFractionDigits]="2" [min]="0.01"></p-inputNumber>
          <label for="marks" class="required-label">Marks</label>
        </p-floatlabel>
        <small class="text-red-500" *ngIf="hasError('marks')">Marks must be greater than 0.</small>

        <p-floatlabel variant="in" class="sm:col-span-2">
          <textarea pTextarea id="explanation" class="w-full" formControlName="explanation" rows="2"></textarea>
          <label for="explanation">Explanation (optional)</label>
        </p-floatlabel>

        <p-floatlabel variant="in" class="sm:col-span-2" *ngIf="isSubjective">
          <textarea pTextarea id="modelAnswer" class="w-full" formControlName="modelAnswer" rows="2"></textarea>
          <label for="modelAnswer">Model Answer (optional)</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="table-container p-4" *ngIf="!isSubjective">
      <div class="mb-3 flex items-center justify-between">
        <h3 class="table-title">Options</h3>
        <button pButton type="button" severity="secondary" *ngIf="isMcq" (click)="addOption()">
          <i class="fa fa-plus"></i>
          <span>Add Option</span>
        </button>
      </div>

      <div class="flex flex-col gap-2">
        <div *ngFor="let option of options; let i = index" class="flex items-center gap-3 rounded-lg border border-gray-200 bg-white p-3 dark:border-neutral dark:bg-dark">
          <span class="flex h-6 w-6 items-center justify-center rounded-full bg-blue-100 text-xs font-semibold text-blue-700">{{ i + 1 }}</span>

          <input
            pInputText
            class="flex-1"
            [(ngModel)]="option.optionText"
            [ngModelOptions]="{ standalone: true }"
            [readonly]="isTrueFalse"
            [placeholder]="'Option text'"
          />

          <label class="flex items-center gap-1 text-sm">
            <p-checkbox [(ngModel)]="option.isCorrect" [ngModelOptions]="{ standalone: true }" [binary]="true"></p-checkbox>
            Correct
          </label>

          <button type="button" class="text-danger" *ngIf="isMcq" title="Remove option" (click)="removeOption(i)">
            <i class="fa fa-trash"></i>
          </button>
        </div>

        <div *ngIf="options.length === 0" class="rounded-lg border border-dashed border-gray-300 p-4 text-center text-sm text-gray-500">
          <p>No options yet — add at least 2.</p>
        </div>
      </div>

      <small class="mt-2 block text-red-500" *ngIf="formSubmitted && optionsAreInvalid">Fix the options above before saving.</small>
    </div>

    <small class="mt-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

    <div class="mt-4 flex gap-2">
      <button pButton type="submit">
        <i class="fa fa-save"></i>
        <span>{{ isEditMode ? 'Save Changes' : 'Create Question' }}</span>
      </button>
      <button pButton type="button" severity="secondary" [routerLink]="['/exam-questions/exam-question-list']">
        <span>Cancel</span>
      </button>
    </div>
  </form>
</section>
