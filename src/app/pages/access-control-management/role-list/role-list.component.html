<section class="page-container">
  <div class="flex justify-between items-center gap-3 mb-4">
    <h3 class="table-title">Roles</h3>
    <button pButton [routerLink]="['/access-control', 'manage-role']">
      <i class="fa fa-plus"></i>
      <span>Add Role</span>
    </button>
  </div>

  <div *ngIf="loading" class="space-y-3">
    <p-skeleton height="3rem" *ngFor="let i of skeletonItems"></p-skeleton>
  </div>

  <div *ngIf="!loading && roles.length === 0" class="table-container">
    <div class="not-found">
      <i class="fa fa-magnifying-glass-minus"></i>
      <p>No roles configured yet.</p>
    </div>
  </div>

  <p-table *ngIf="!loading && roles.length > 0" [value]="roles" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Effective Access</th>
        <th style="width: 14rem">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-role>
      <tr>
        <td>{{ role.name }}</td>
        <td>
          <span class="rounded-full px-2 py-0.5 text-xs font-medium" [ngClass]="role.isSystemRole ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'">
            {{ role.isSystemRole ? 'System' : 'Custom' }}
          </span>
        </td>
        <td>{{ accessSummary(role) }}</td>
        <td>
          <div class="flex gap-2">
            <button pButton size="small" severity="secondary" [routerLink]="['/access-control', 'manage-role', role.roleId]">
              <i class="fa" [ngClass]="role.isSystemRole ? 'fa-eye' : 'fa-edit'"></i>
              <span>{{ role.isSystemRole ? 'View' : 'Edit' }}</span>
            </button>
            <button
              pButton
              size="small"
              severity="danger"
              *ngIf="!role.isSystemRole"
              (click)="deleteRole(role, $event)"
            >
              <i class="fa fa-trash"></i>
              <span>Delete</span>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-confirmDialog></p-confirmDialog>
</section>
