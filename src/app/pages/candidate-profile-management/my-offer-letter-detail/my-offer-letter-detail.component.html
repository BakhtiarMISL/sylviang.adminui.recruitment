<section class="page-container" *ngIf="!loading">
  <small class="mb-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

  <ng-container *ngIf="item">
    <div class="table-container mb-4 p-4">
      <div class="flex justify-between items-center flex-wrap gap-3">
        <div>
          <h3 class="table-title mb-1">{{ item.designation }}</h3>
          <span
            [ngClass]="{
              'text-green-600': item.status === 'Accepted',
              'text-red-500': item.status === 'Declined',
              'text-neutral': item.status === 'Generated' || item.status === 'Sent',
            }"
          >
            {{ item.status }}
          </span>
          <span class="text-xs text-neutral" *ngIf="item.decisionAt"> &middot; decided {{ item.decisionAt | date: 'dd-MMM-yyyy h:mm a' }}</span>
        </div>

        <div class="flex gap-2" *ngIf="isUndecided">
          <button pButton [disabled]="submitting" (click)="accept()">
            <i class="fa fa-check"></i>
            <span>Accept Offer</span>
          </button>
          <button pButton severity="danger" [disabled]="submitting" (click)="openDeclineDialog()">
            <i class="fa fa-xmark"></i>
            <span>Decline Offer</span>
          </button>
        </div>
      </div>

      <div class="mt-3" *ngIf="item.status === 'Declined' && item.declineReason">
        <strong>Decline reason:</strong> {{ item.declineReason }}
      </div>
    </div>

    <div class="table-container p-2">
      <iframe *ngIf="pdfUrl" [src]="pdfUrl" style="width: 100%; height: 75vh; border: none"></iframe>
    </div>
  </ng-container>

  <p-dialog header="Decline Offer" [(visible)]="declineDialogVisible" [modal]="true" [style]="{ width: '28rem', maxWidth: '95vw' }">
    <p-floatlabel variant="in">
      <textarea pTextarea id="declineReason" class="w-full" rows="4" [(ngModel)]="declineReason"></textarea>
      <label for="declineReason">Reason for declining</label>
    </p-floatlabel>
    <small class="mt-2 block text-red-500" *ngIf="declineErrorMessage">{{ declineErrorMessage }}</small>

    <div class="mt-4 flex justify-end gap-2 pb-2">
      <button pButton severity="secondary" [disabled]="submitting" (click)="declineDialogVisible = false">Cancel</button>
      <button pButton severity="danger" [disabled]="submitting" (click)="confirmDecline()">Confirm Decline</button>
    </div>
  </p-dialog>
</section>
