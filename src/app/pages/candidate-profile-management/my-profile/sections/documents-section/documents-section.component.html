<div class="form-container">
  <div class="sm:col-span-2" *ngIf="loading">Loading documents...</div>

  <div class="sm:col-span-2 text-sm text-neutral" *ngIf="!loading && items.length === 0">No documents uploaded yet.</div>

  <div class="sm:col-span-2" *ngIf="!loading">
    <div class="list-row" *ngFor="let item of items">
      <div>
        <strong>{{ getDocumentTypeLabel(item.documentType) }}</strong> <span>—</span>
        <a [href]="getDownloadUrl(item)" target="_blank" rel="noopener noreferrer" class="text-primary">{{ item.fileName }}</a>
        <span class="text-sm text-neutral ml-2">({{ formatFileSize(item.fileSizeBytes) }})</span>
      </div>
      <button class="text-danger" (click)="delete(item)" type="button">
        <i class="fa fa-trash"></i>
      </button>
    </div>
  </div>

  <div>
    <p-floatlabel variant="in">
      <p-select [options]="documentTypeOptions" [appendTo]="'body'" [autoDisplayFirst]="false" optionLabel="label" optionValue="value" [(ngModel)]="selectedType" class="w-full"></p-select>
      <label>Document Type</label>
    </p-floatlabel>
  </div>

  <div class="flex items-center gap-3">
    <label for="documentFile" class="upload-dropzone flex-1">
      <i class="fas fa-file-arrow-up"></i>
      <span class="upload-dropzone-text">
        <strong>{{ selectedFile?.name || 'Click to upload a document' }}</strong>
        <small>PDF, JPG, PNG or DOCX</small>
      </span>
    </label>
    <input id="documentFile" type="file" (change)="onFileSelected($event)" accept=".pdf,.jpg,.jpeg,.png,.docx" class="sr-only" />
    <button pButton type="button" [disabled]="!selectedFile || uploading" (click)="upload()">
      <i class="fa fa-upload"></i>
      <span>{{ uploading ? 'Uploading...' : 'Upload' }}</span>
    </button>
  </div>
  <div *ngIf="fileError" class="invalid sm:col-span-2">{{ fileError }}</div>
</div>
