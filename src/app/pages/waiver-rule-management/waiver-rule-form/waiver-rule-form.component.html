<section class="page-container" *ngIf="form">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="table-container mb-4 p-4">
      <h3 class="table-title mb-3">{{ isEditMode ? 'Edit' : 'Add' }} Waiver Rule</h3>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div>
          <p-floatlabel variant="in">
            <input pInputText id="name" class="w-full" formControlName="name" />
            <label for="name" class="required-label">Name</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('name')">Name is required.</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <p-inputnumber inputId="priority" class="w-full" formControlName="priority" [useGrouping]="false"></p-inputnumber>
            <label for="priority" class="required-label">Priority (lower evaluates first)</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('priority')">Priority is required.</small>
        </div>

        <div>
          <p-floatlabel variant="in">
            <p-select
              inputId="candidateTypeFilter"
              class="w-full"
              [options]="candidateTypeOptions"
              formControlName="candidateTypeFilter"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
            ></p-select>
            <label for="candidateTypeFilter">Candidate Type</label>
          </p-floatlabel>
        </div>

        <div>
          <p-floatlabel variant="in">
            <p-select
              inputId="specialCategoryId"
              class="w-full"
              [options]="specialCategoryOptions"
              formControlName="specialCategoryId"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
            ></p-select>
            <label for="specialCategoryId">Special Category</label>
          </p-floatlabel>
        </div>

        <div>
          <p-floatlabel variant="in">
            <p-select
              inputId="referralSourceId"
              class="w-full"
              [options]="referralSourceOptions"
              formControlName="referralSourceId"
              optionLabel="label"
              optionValue="value"
              [appendTo]="'body'"
            ></p-select>
            <label for="referralSourceId">Referral Source</label>
          </p-floatlabel>
        </div>

        <div class="sm:col-span-2">
          <p-floatlabel variant="in">
            <textarea pTextarea id="description" class="w-full" formControlName="description" rows="3"></textarea>
            <label for="description">Description</label>
          </p-floatlabel>
          <small class="text-red-500" *ngIf="hasError('description')">Description must not exceed 1000 characters.</small>
        </div>

        <div class="checkbox-container">
          <p-checkbox inputId="isActive" formControlName="isActive" [binary]="true"></p-checkbox>
          <label for="isActive">Active</label>
        </div>
      </div>

      <small class="mt-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

      <div class="mt-4 flex gap-2">
        <button pButton type="submit">
          <i class="fa fa-save"></i>
          <span>{{ isEditMode ? 'Save Changes' : 'Create Waiver Rule' }}</span>
        </button>
        <button pButton type="button" severity="secondary" [routerLink]="['/waiver-rule-management', 'waiver-rule-list']">
          <span>Cancel</span>
        </button>
      </div>
    </div>
  </form>
</section>
