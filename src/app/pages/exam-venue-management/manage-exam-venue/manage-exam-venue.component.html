<section class="page-container">
  <form [formGroup]="venueForm" (ngSubmit)="onSubmit()">
    <div class="table-container mb-4 p-4">
      <h3 class="table-title mb-3">{{ isEditMode ? 'Edit Exam Venue' : 'Add Exam Venue' }}</h3>

      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <p-floatlabel variant="in">
          <input pInputText id="venueName" class="w-full" formControlName="venueName" />
          <label for="venueName">Venue Name</label>
        </p-floatlabel>
        <small class="text-red-500" *ngIf="hasError('venueName')">Venue name is required.</small>

        <p-floatlabel variant="in">
          <input pInputText id="location" class="w-full" formControlName="location" />
          <label for="location">Location / Address</label>
        </p-floatlabel>
        <small class="text-red-500" *ngIf="hasError('location')">Location is required.</small>
      </div>

      <small class="mt-3 block text-red-500" *ngIf="errorMessage">{{ errorMessage }}</small>

      <div class="mt-4 flex gap-2">
        <button pButton type="submit">
          <i class="fa fa-save"></i>
          <span>{{ isEditMode ? 'Save Changes' : 'Create Venue' }}</span>
        </button>
        <button pButton type="button" severity="secondary" [routerLink]="['/exam-venues/exam-venue-list']">
          <span>Cancel</span>
        </button>
      </div>
    </div>
  </form>
</section>
