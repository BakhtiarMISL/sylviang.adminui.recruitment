<section class="page-container">
  <div class="flex justify-between items-center gap-3 mb-4">
    <h3 class="table-title">Rooms{{ venueName ? ' — ' + venueName : '' }}</h3>
    <div class="flex gap-2">
      <button pButton severity="secondary" [routerLink]="['/exam-venues/exam-venue-list']">
        <i class="fa fa-arrow-left"></i>
        <span>Back to Venues</span>
      </button>
      <button pButton [routerLink]="['/exam-venues/exam-venue', examVenueId, 'manage-room']">
        <i class="fa fa-plus"></i>
        <span>Add Room</span>
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="space-y-3">
    <p-skeleton height="4rem" *ngFor="let i of skeletonItems"></p-skeleton>
  </div>

  <div *ngIf="!loading && rooms.length === 0" class="table-container">
    <div class="not-found">
      <i class="fa fa-magnifying-glass-minus"></i>
      <p>No rooms configured yet for this venue.</p>
    </div>
  </div>

  <div *ngIf="!loading" class="grid grid-cols-1 gap-4">
    <div *ngFor="let room of rooms" class="rounded-lg bg-white p-4 shadow-sm dark:bg-dark">
      <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-center">
        <div>
          <div class="flex items-center gap-2">
            <h4 class="text-lg font-medium text-gray-900 dark:text-white">{{ room.roomName }}</h4>
            <span
              class="rounded-full px-2 py-0.5 text-xs font-medium"
              [ngClass]="room.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'"
            >
              {{ room.isActive ? 'Active' : 'Inactive' }}
            </span>
          </div>
          <p class="text-sm text-gray-600 dark:text-gray-300">
            Capacity: {{ room.capacity }} &middot; Invigilators required: {{ room.requiredInvigilatorCount }}
          </p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button pButton severity="secondary" [routerLink]="['/exam-venues/exam-venue', examVenueId, 'manage-room', room.examRoomId]">
            <i class="fa fa-edit"></i>
            <span>Edit</span>
          </button>
          <button pButton [severity]="room.isActive ? 'danger' : 'success'" (click)="toggleActiveStatus(room, $event)">
            <i class="fa" [ngClass]="room.isActive ? 'fa-ban' : 'fa-check'"></i>
            <span>{{ room.isActive ? 'Deactivate' : 'Activate' }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
