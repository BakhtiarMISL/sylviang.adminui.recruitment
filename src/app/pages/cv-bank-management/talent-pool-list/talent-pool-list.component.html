<section class="page-container">
  <div class="flex justify-between items-center gap-3 mb-4">
    <h2 class="text-lg font-semibold">Talent Pool</h2>
    <a routerLink=".." class="text-primary">
      <i class="fa fa-arrow-left"></i>
      <span>Back to CV Bank Search</span>
    </a>
  </div>

  <div class="table-container">
    <div class="table-title-container">
      <h3 class="table-title">
        Candidates
        <span class="table-title-info" *ngIf="entries.length > 0">({{ entries.length }} total)</span>
      </h3>
    </div>

    <div class="transition-all duration-500 ease-in-out">
      <p-table [value]="loading ? skeletonItems : entries" dataKey="candidateProfileId" [responsiveLayout]="'scroll'">
        <ng-template pTemplate="header">
          <tr>
            <th style="width: 3rem"></th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th style="width: 10rem">Added</th>
            <th style="width: 6rem">Remove</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-entry>
          @if (loading) {
            <tr>
              <td><p-skeleton width="2rem" height="2rem" styleClass="!rounded-full"></p-skeleton></td>
              <td><p-skeleton width="100%" height="1rem"></p-skeleton></td>
              <td><p-skeleton width="100%" height="1rem"></p-skeleton></td>
              <td><p-skeleton width="100%" height="1rem"></p-skeleton></td>
              <td><p-skeleton width="100%" height="1rem"></p-skeleton></td>
              <td><p-skeleton width="2rem" height="1rem"></p-skeleton></td>
            </tr>
          } @else {
            <tr>
              <td>
                <img *ngIf="getPhotoUrl(entry)" [src]="getPhotoUrl(entry)" class="candidate-avatar" alt="" />
                <i *ngIf="!getPhotoUrl(entry)" class="fa-solid fa-circle-user candidate-avatar-placeholder"></i>
              </td>
              <td>{{ entry.fullName }}</td>
              <td>{{ entry.email }}</td>
              <td>{{ entry.phone || '-' }}</td>
              <td>{{ entry.addedAt | date: 'dd-MMM-yyyy' }}</td>
              <td>
                <button (click)="remove(entry, $event)" class="text-red-600">
                  <i class="fa fa-trash"></i>
                </button>
              </td>
            </tr>
          }
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="6" class="not-found">
              <div>
                <i class="fa fa-magnifying-glass-minus"></i>
                <p>Talent pool is empty</p>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</section>
