<section class="page-container">
  <div class="flex justify-between items-center gap-3 mb-4">
    <h3 class="table-title">Exam Halls</h3>
    <button pButton [routerLink]="['/exam-halls/manage-exam-hall']">
      <i class="fa fa-plus"></i>
      <span>Add Hall</span>
    </button>
  </div>

  <div *ngIf="loading" class="space-y-3">
    <p-skeleton height="4rem" *ngFor="let i of skeletonItems"></p-skeleton>
  </div>

  <div *ngIf="!loading && halls.length === 0" class="table-container">
    <div class="not-found">
      <i class="fa fa-magnifying-glass-minus"></i>
      <p>No exam halls configured yet.</p>
    </div>
  </div>

  <div *ngIf="!loading" class="grid grid-cols-1 gap-4">
    <div *ngFor="let hall of halls" class="rounded-lg bg-white p-4 shadow-sm dark:bg-dark">
      <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-center">
        <div>
          <div class="flex items-center gap-2">
            <h4 class="text-lg font-medium text-gray-900 dark:text-white">{{ hall.hallName }}</h4>
            <span
              class="rounded-full px-2 py-0.5 text-xs font-medium"
              [ngClass]="hall.isActive ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'"
            >
              {{ hall.isActive ? 'Active' : 'Inactive' }}
            </span>
          </div>
          <p class="text-sm text-gray-600 dark:text-gray-300">{{ hall.location }}</p>
          <p class="text-sm text-gray-600 dark:text-gray-300">
            Capacity: {{ hall.totalCapacity }} &middot; Invigilators: {{ hall.invigilatorEmployeeIds.length }}
          </p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button pButton severity="secondary" [routerLink]="['/exam-halls/manage-exam-hall', hall.examHallId]">
            <i class="fa fa-edit"></i>
            <span>Edit</span>
          </button>
          <button pButton [severity]="hall.isActive ? 'danger' : 'success'" (click)="toggleActiveStatus(hall, $event)">
            <i class="fa" [ngClass]="hall.isActive ? 'fa-ban' : 'fa-check'"></i>
            <span>{{ hall.isActive ? 'Deactivate' : 'Activate' }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
