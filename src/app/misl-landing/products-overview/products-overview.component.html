<section class="msl-overview" id="products">
  <div class="msl-overview__header" mislReveal="fade-up">
    <h2>Our Products</h2>
    <p>Explore MISL's enterprise software solutions designed to transform business operations.</p>
  </div>

  <div class="msl-overview__grid">
    @for (product of products; track product.id; let i = $index) {
      <div [mislReveal]="'fade-up'" [mislRevealDelay]="i * 90">
        <app-product-card [product]="product" [active]="product.id === activeId" (select)="onSelect($event)" />
      </div>
    }
  </div>
</section>
