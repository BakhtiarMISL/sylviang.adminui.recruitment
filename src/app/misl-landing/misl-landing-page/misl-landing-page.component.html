<main class="msl-page">
  <section class="msl-hero">
    <div class="msl-hero__inner" mislReveal="fade-up">
      <span class="msl-hero__eyebrow">Millennium Information Solution Ltd.</span>
      <h1>One Company. A Full Suite of Enterprise Software.</h1>
      <p>
        From core banking to HR, audit, and recruitment &mdash; MISL builds the systems Bangladesh's leading
        organizations run on.
      </p>
    </div>
  </section>

  <app-products-overview [products]="products" [activeId]="activeId()" (productSelected)="onProductSelected($event)" />

  <div #sectionsHost class="msl-sections">
    @for (product of products; track product.id; let i = $index) {
      <app-product-section [product]="product" [reversed]="i % 2 === 1" />
    }
  </div>
</main>
